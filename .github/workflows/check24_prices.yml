name: Check24 Prijsmonitor

on:
  schedule:
    # 4x per dag op verschillende momenten (dynamische prijzen). Tijden in UTC;
    # CET = UTC+1 (winter), CEST = UTC+2 (zomer). Oneven minuten: GitHub
    # vertraagt/skipt runs op het hele uur vaker.
    - cron: '17 5 * * *'    # 06:17 CET — vroege ochtend
    - cron: '43 11 * * *'   # 12:43 CET — middag
    - cron: '29 17 * * *'   # 18:29 CET — avond
    - cron: '11 22 * * *'   # 23:11 CET — laat (nacht-repricing)
  workflow_dispatch:   # ook handmatig starten via GitHub UI

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      issues: write   # nodig voor het aanmaken van een Issue bij goede prijs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Dependencies installeren
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Prijzen ophalen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python check24_crawler.py

      - name: Datumscanner draaien
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python check24_dates.py

      - name: Resultaten opslaan als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prijzen-${{ github.run_id }}
          path: |
            check24_live_*.json
            check24_dates_*.json
          retention-days: 30
